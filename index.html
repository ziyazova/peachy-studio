    html,

    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
    }

    /* No-JS fallback below (#boot-fallback) must never flash on a healthy
       load. The browser paints the HTML long before the bundle is fetched and
       executed, so the markup was visible for a beat on every page. It now
       starts invisible and only fades in after 2.5s — by which point React has
       already replaced #root's contents anywhere scripts actually run. When
       they never run (the Notion mobile app case this was built for) nothing
       clears it and it appears as intended. */
    #boot-fallback {
      opacity: 0;
      animation: boot-fallback-in 0.2s linear 2.5s forwards;
    }

    @keyframes boot-fallback-in {
      to { opacity: 1; }
    }

    #root {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      box-sizing: border-box;
    }

<body>
  <!-- Static no-JS fallback.
       React 18's createRoot() clears this container on its first render, so in
       any healthy environment it is never seen. It exists because of the Notion
       mobile app: there the iframe showed an empty frame, and even the inline
       boot watchdog below stayed silent — which can only happen if scripts in
       that frame never run at all. indify.co, which DOES render in the same
       app, ships its widget markup server-rendered in the HTML; we shipped an
       empty <div> and relied entirely on the bundle.

       So this is both the diagnostic (if it appears, scripts are the problem,
       not our code) and the graceful degradation (something legible instead of
       a blank rectangle). Inline styles only: styled-components injects its CSS
       from JavaScript, so no stylesheet of ours exists at this point. -->
  <div id="root"><div id="boot-fallback" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><div style="width:100%;max-width:360px;aspect-ratio:2/3;border-radius:38px;background:linear-gradient(152deg,#396539 0%,#2E5230 38%,#244228 70%,#19321E 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-sizing:border-box;padding:9%"><div style="font-size:56px;font-weight:400;letter-spacing:-0.025em;line-height:1">10:00</div><div style="margin-top:14px;font-size:11px;font-weight:500;letter-spacing:0.18em;opacity:0.6">MEDITATION</div><div style="margin-top:28px;font-size:12px;line-height:1.5;opacity:0.65;text-align:center;max-width:260px">Interactive timer needs JavaScript.<br>Open this widget in a browser to use it.</div></div></div></div>

  <!-- Boot watchdog.
       Deliberately plain ES5 in a NON-module script, placed BEFORE the bundle.

       Two reasons it lives here and not in main.tsx:
       1. If the bundle fails to PARSE (an older Safari meeting syntax it does
          not know), main.tsx never executes at all — a handler inside it cannot
          catch its own module failing to load.
       2. Logger is dev-only and is stripped from production builds, so in prod
          a global error was previously swallowed in silence. The result was a
          blank white page with nothing to go on, on a device with no console.

       This turns that white screen into a readable report the user can
       screenshot. It renders ONLY if #root is still empty, so a healthy app
       never sees it. -->
  <script>
  (function () {
    var lastError = null;

    window.addEventListener('error', function (e) {
      lastError = (e && (e.message || (e.error && e.error.message))) || 'Script error';
      if (e && e.filename) lastError += '\n' + e.filename + ':' + (e.lineno || 0);
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      lastError = 'Unhandled rejection: ' + ((r && (r.message || r)) || 'unknown');
    });

    function report() {
      var root = document.getElementById('root');
      if (!root || root.children.length > 0) return;
      root.innerHTML =
        '<div style="font:14px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;' +
        'padding:24px;max-width:640px;margin:0 auto;color:#1F1F1F">' +
        '<div style="font-weight:600;font-size:16px;margin-bottom:8px">This widget failed to start</div>' +
        '<div style="color:#555;margin-bottom:16px">Screenshot this and send it over — it says what broke.</div>' +
        '<pre style="white-space:pre-wrap;word-break:break-word;background:#F5F5F5;' +
        'border-radius:8px;padding:12px;font-size:12px;color:#333;margin:0">' +
        (lastError ? esc(lastError) : 'No error was reported — the script may not have loaded at all.') +
        '\n\n' + esc(navigator.userAgent) +
        '\n' + esc(location.href) +
        '</pre></div>';
    }

    function esc(t) {
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Long enough that a slow phone connection is never mistaken for a failure.
    setTimeout(report, 8000);
  })();
  </script>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    const postSize = (h) => {
      window.parent.postMessage({ type: 'embed-size', height: h }, '*');
    };

    const resize = () => postSize(document.documentElement.scrollHeight);

    const debounce = (fn, ms = 200) => {
      let id;
      return () => {
        clearTimeout(id);
        id = setTimeout(fn, ms);
      };
    };

    new ResizeObserver(debounce(resize)).observe(document.documentElement);
    window.addEventListener('load', resize);
  </script>
</body>
